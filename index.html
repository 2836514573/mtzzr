<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>梦幻幸运转盘 · 弹框编辑版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #f0f2f5 0%, #e6e9f0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 40px;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* 主卡片 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
            padding: 20px 20px 30px;
            width: 100%;
            max-width: 500px;
            transition: all 0.2s ease;
        }

        /* 转盘容器 */
        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 15px auto 5px;
        }

        .wrap {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3), 0 0 0 6px #fef9c3, 0 0 0 12px #ffedd5;
            transition: box-shadow 0.2s;
        }

        /* 固定华丽指针 */
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 34px solid #1e293b;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.3));
            z-index: 12;
        }

        .pointer::after {
            content: "✨";
            position: absolute;
            font-size: 18px;
            left: -8px;
            top: 20px;
            color: #ffd966;
            text-shadow: 0 0 2px gold;
        }

        /* 中心抽奖按钮 */
        .center {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ffb347, #ff7e05);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transition: 0.08s linear;
            font-family: inherit;
            letter-spacing: 2px;
            backdrop-filter: blur(2px);
            border: 2px solid #ffefb0;
        }

        .center:active {
            transform: translate(-50%, -50%) scale(0.94);
        }

        #res {
            margin-top: 20px;
            background: #fff7e5;
            border-radius: 60px;
            padding: 12px 20px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: #c2410c;
            box-shadow: inset 0 1px 4px #0001, 0 4px 12px rgba(0, 0, 0, 0.05);
            border-left: 6px solid #f97316;
            word-break: break-word;
        }

        /* 编辑按钮 */
        .edit-btn-area {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #2c3e66, #1e2a4a);
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:active {
            transform: scale(0.96);
        }

        /* ----- 模态框样式 ----- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s ease;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-container {
            background: #fffef7;
            width: 90%;
            max-width: 400px;
            border-radius: 48px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transform: scale(0.92);
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            background: #ffedd5;
            padding: 18px 22px;
            border-bottom: 2px solid #fbbf24;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #b45309;
            transition: 0.1s;
            line-height: 1;
            padding: 0 6px;
        }

        .close-modal:active {
            transform: scale(0.9);
        }

        .modal-body {
            padding: 22px 20px 28px;
        }

        .modal-body p {
            font-weight: 600;
            margin-bottom: 10px;
            color: #2d3e50;
            font-size: 0.9rem;
        }

        .modal-textarea {
            width: 100%;
            height: 180px;
            padding: 12px 14px;
            font-size: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 28px;
            background: white;
            resize: vertical;
            font-family: inherit;
            transition: 0.2s;
            outline: none;
            font-weight: 500;
            color: #0f172a;
            line-height: 1.5;
        }

        .modal-textarea:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 24px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn-cancel {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            color: #334155;
            transition: 0.2s;
        }

        .btn-generate:active, .btn-cancel:active {
            transform: scale(0.95);
        }

        .toast-tip {
            font-size: 0.75rem;
            margin-top: 16px;
            color: #475569;
            text-align: center;
        }

        footer {
            font-size: 12px;
            margin-top: 18px;
            color: #5b6e8c;
        }

        @media (min-width: 480px) {
            .wheel-wrapper {
                width: 320px;
                height: 320px;
            }

            .center {
                width: 80px;
                height: 80px;
                font-size: 18px;
            }

            .pointer {
                border-left: 22px solid transparent;
                border-right: 22px solid transparent;
                border-bottom: 38px solid #1e293b;
                top: -20px;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <!-- 转盘展示区 -->
    <div class="wheel-wrapper">
        <div class="wrap">
            <div class="pointer"></div>
            <canvas id="wheel" width="500" height="500" style="width:100%; height:100%"></canvas>
            <div class="center" id="spinBtn">🎲<br>抽奖</div>
        </div>
    </div>
    <div id="res">✨ 点击中间转盘，好运开启 ✨</div>

    <!-- 独立的编辑按钮 (触发弹框) -->
    <div class="edit-btn-area">
        <button class="btn-edit" id="openModalBtn">✏️ 编辑转盘选项</button>
    </div>
    <div class="toast-tip">⭐ 指针固定 · 完全随机抽奖 ⭐ 点「编辑」自定义奖品</div>
</div>
<footer>⚡ 弹框配置转盘 | 生成后自动刷新</footer>

<!-- 模态框结构 (配置转盘) -->
<div id="wheelModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3>🎨 自定义奖项</h3>
            <button class="close-modal" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body">
            <p>📝 填写选项（换行分隔，每项一个）</p>
            <textarea id="modalItemList" class="modal-textarea" placeholder="例如：&#10;火锅&#10;烧烤&#10;奶茶&#10;看电影&#10;宅家&#10;逛超市"></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelModalBtn">取消</button>
                <button class="btn-generate" id="generateFromModalBtn">✨ 生成转盘</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM 元素 ----------
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const resDiv = document.getElementById('res');
        const spinBtn = document.getElementById('spinBtn');
        const openModalBtn = document.getElementById('openModalBtn');
        const modalOverlay = document.getElementById('wheelModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const generateModalBtn = document.getElementById('generateFromModalBtn');
        const modalTextarea = document.getElementById('modalItemList');

        // ---------- 全局变量 ----------
        let items = [];                // 奖品列表
        let currentRotation = 0;      // 转盘累计旋转角度 (deg)
        let isSpinning = false;        // 是否抽奖动画中
        let animFrameId = null;
        let targetRotation = 0;
        let spinStartTime = 0;
        let spinDuration = 1800;        // 动画时长 ms
        let startRotation = 0;

        // 华丽配色池 (高饱和差异化)
        const colorPalette = [
            '#F94144', '#F9844A', '#F9C74F', '#90BE6D', '#43AA8B', '#4D908E', '#577590', '#9B5DE5',
            '#F15BB5', '#FEE440', '#00BBF9', '#00F5D4', '#E36414', '#9C89B8', '#EF476F', '#FFB703',
            '#2B9348', '#0077B6', '#E63946', '#A8DADC', '#6D597A', '#B56576', '#E56B6F', '#06D6A0',
            '#118AB2', '#FCF6BD'
        ];
        const POINTER_ANGLE_DEG = 270;   // 指针指向正上方12点钟

        // ---------- 辅助: canvas尺寸自适应 ----------
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = container.clientWidth;
            canvas.width = size;
            canvas.height = size;
            drawWheel();
        }

        // 文本绘制 (防倒置 + 超长省略)
        function drawSectorText(text, radius, midAngleDeg) {
            let displayText = text;
            const maxLen = 8;
            if ([...text].length > maxLen) {
                displayText = [...text].slice(0, maxLen - 1).join('') + '…';
            }
            ctx.save();
            const textRadius = radius * 0.68;
            const rad = midAngleDeg * Math.PI / 180;
            const x = Math.cos(rad) * textRadius;
            const y = Math.sin(rad) * textRadius;
            ctx.translate(x, y);
            let rotateAngle = rad;
            // 避免文字颠倒: 如果角度范围在左侧或下方区域，翻转180度
            if (rad > Math.PI / 2 && rad < 3 * Math.PI / 2) {
                rotateAngle = rad + Math.PI;
            }
            ctx.rotate(rotateAngle);
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.font = `bold ${Math.max(12, Math.min(18, Math.floor(radius / 12)))}px "Segoe UI", "PingFang SC", system-ui`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 2;
            ctx.fillText(displayText, 0, 0);
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // 绘制转盘 (核心)
        function drawWheel() {
            if (!ctx) return;
            const size = canvas.width;
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size * 0.46;

            if (!items || items.length === 0) {
                ctx.clearRect(0, 0, size, size);
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 14px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('暂无选项', 0, 0);
                ctx.fillText('点击「编辑转盘」', 0, 22);
                ctx.restore();
                return;
            }

            const count = items.length;
            const angleStep = 360 / count;
            ctx.clearRect(0, 0, size, size);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation * Math.PI / 180);

            for (let i = 0; i < count; i++) {
                const startDeg = i * angleStep;
                const endDeg = (i + 1) * angleStep;
                const startRad = startDeg * Math.PI / 180;
                const endRad = endDeg * Math.PI / 180;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startRad, endRad);
                ctx.closePath();
                ctx.fillStyle = colorPalette[i % colorPalette.length];
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startRad, endRad);
                ctx.lineTo(0, 0);
                ctx.stroke();

                const midDeg = startDeg + angleStep / 2;
                drawSectorText(items[i], radius, midDeg);
            }

            // 中心小圆装饰
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.16, 0, 2 * Math.PI);
            ctx.fillStyle = '#FFD966';
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.09, 0, 2 * Math.PI);
            ctx.fillStyle = '#F39C12';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            // 外圈细边装饰
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 4, 0, 2 * Math.PI);
            ctx.strokeStyle = '#FFE8B6';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        // 根据当前旋转角度和指针位置计算中奖索引
        function getCurrentPrizeIndex() {
            if (!items.length) return -1;
            const count = items.length;
            const angleStep = 360 / count;
            const fixedPointer = POINTER_ANGLE_DEG;
            for (let i = 0; i < count; i++) {
                let startLocal = i * angleStep;
                let endLocal = (i + 1) * angleStep;
                let globalStart = (startLocal + currentRotation) % 360;
                let globalEnd = (endLocal + currentRotation) % 360;
                if (globalStart < globalEnd) {
                    if (fixedPointer >= globalStart && fixedPointer < globalEnd) return i;
                } else {
                    if (fixedPointer >= globalStart || fixedPointer < globalEnd) return i;
                }
            }
            return 0;
        }

        // 平滑动画
        function animateSpin(now) {
            const elapsed = now - spinStartTime;
            let t = Math.min(1, elapsed / spinDuration);
            const easeOutCubic = 1 - Math.pow(1 - t, 3);
            const currentAngle = startRotation + (targetRotation - startRotation) * easeOutCubic;
            currentRotation = currentAngle % 360;
            drawWheel();

            if (t < 1) {
                animFrameId = requestAnimationFrame(animateSpin);
            } else {
                currentRotation = targetRotation % 360;
                drawWheel();
                const finalIdx = getCurrentPrizeIndex();
                if (finalIdx !== -1 && items[finalIdx]) {
                    resDiv.innerHTML = `🎉 恭喜中奖： ${items[finalIdx]} 🎉`;
                    resDiv.style.transform = 'scale(1.02)';
                    setTimeout(() => { resDiv.style.transform = ''; }, 300);
                } else if (items.length === 0) {
                    resDiv.innerHTML = '⚠️ 请先通过「编辑转盘」添加奖品 ⚠️';
                } else {
                    resDiv.innerHTML = '🎲 转盘休息一下，再试一次~';
                }
                isSpinning = false;
                animFrameId = null;
                if (spinBtn) spinBtn.style.opacity = '1';
            }
        }

        function stopAnimation() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            isSpinning = false;
        }

        // 抽奖启动
        function startRotate() {
            if (!items.length) {
                resDiv.innerHTML = '⚠️ 还没有奖品！请点击「编辑转盘选项」添加内容 ⚠️';
                return;
            }
            if (items.length < 2) {
                resDiv.innerHTML = `🎁 只有一个选项，直接获得： ${items[0]} 🎁`;
                return;
            }
            if (isSpinning) {
                resDiv.innerHTML = '⏳ 转盘转动中，请稍后再试～';
                return;
            }

            stopAnimation();

            const extraRounds = 8 + Math.floor(Math.random() * 8); // 8~15圈
            const baseExtraDeg = extraRounds * 360;
            const randomOffset = Math.random() * 360;
            const delta = baseExtraDeg + randomOffset;
            targetRotation = currentRotation + delta;
            startRotation = currentRotation;
            spinStartTime = performance.now();
            isSpinning = true;
            resDiv.innerHTML = '🌀 转盘旋转中，好运降临... 🌀';
            if (spinBtn) spinBtn.style.opacity = '0.7';
            animFrameId = requestAnimationFrame(animateSpin);
        }

        // ---------- 弹框内“生成转盘”核心逻辑 (更新items, 重置转盘状态) ----------
        function generateWheelFromModal() {
            // 获取文本框内容并解析
            let raw = modalTextarea.value;
            let lines = raw.split(/\r?\n/);
            let newItems = lines.filter(line => line.trim().length > 0).map(l => l.trim());
            if (newItems.length === 0) {
                // 如果用户清空了，给一个默认占位，避免白板
                newItems = ['火锅', '烧烤', '奶茶', '看电影', '宅家', '逛超市'];
                modalTextarea.value = newItems.join('\n');
                alert('未检测到有效选项，已恢复默认奖品~');
            }
            items = [...newItems];
            // 重置转盘角度 (全新转盘归零)
            currentRotation = 0;
            // 如果有动画在跑则强行停止
            stopAnimation();
            // 重绘转盘
            resizeCanvas();   // 确保画布尺寸匹配并重绘
            drawWheel();
            // 更新结果区域为成功提示
            resDiv.innerHTML = '✨ 转盘已更新！点击中央抽奖 ✨';
            if (spinBtn) spinBtn.style.opacity = '1';
            // 关闭弹框
            closeModal();
        }

        // 弹框控制
        function openModal() {
            // 预填当前items内容到弹框textarea，方便编辑
            if (items.length) {
                modalTextarea.value = items.join('\n');
            } else {
                // 默认示例
                modalTextarea.value = "火锅\n烧烤\n奶茶\n看电影\n宅家\n逛超市";
            }
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // 取消弹框不保存变更
        function cancelModal() {
            closeModal();
        }

        // 初始化默认数据 (第一次默认展示一组奖品)
        function initDefaultItems() {
            const defaultList = ['火锅', '烧烤', '奶茶', '看电影', '宅家', '逛超市'];
            items = [...defaultList];
            modalTextarea.value = defaultList.join('\n');
            currentRotation = 0;
            stopAnimation();
            resizeCanvas();
            drawWheel();
            resDiv.innerHTML = '✨ 点击中间转盘，好运开启 ✨';
        }

        // 监听resize + 初始化
        function bindEvents() {
            window.addEventListener('resize', () => {
                resizeCanvas();
                drawWheel();
            });

            if (spinBtn) spinBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                startRotate();
            });

            if (openModalBtn) openModalBtn.addEventListener('click', openModal);
            if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
            if (cancelModalBtn) cancelModalBtn.addEventListener('click', cancelModal);
            if (generateModalBtn) generateModalBtn.addEventListener('click', generateWheelFromModal);

            // 点击模态框背景关闭 (点击overlay关闭)
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            // 防止键盘ESC关闭? 可选高级，简单添加
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        }

        // 启动一切
        function init() {
            initDefaultItems();
            bindEvents();
        }

        init();
    })();
</script>
</body>
</html>
